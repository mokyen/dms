[env:nucleo_f411re]
platform = ststm32
board = nucleo_f411re
framework = arduino
lib_deps = 
    https://github.com/br3ttb/Arduino-PID-Library.git

; C++ standard - use C++17
build_unflags = -std=gnu++11 -std=gnu++14
build_flags = 
    -std=gnu++17
    -D NUCLEO_F411RE
    -D HAL_TIM_MODULE_ENABLED
    -D HAL_ADC_MODULE_ENABLED
    -O2
    -Wall
    -Wextra

; Upload settings
upload_protocol = stlink
debug_tool = stlink

; Serial monitor settings
monitor_speed = 115200

; Serial monitor filters (optional, helps with line endings)
monitor_filters = 
    default
    time

; Debug configuration (optional, for debugging with ST-Link)
debug_init_break = tbreak setup

[env:uno]
platform = atmelavr
board = uno
framework = arduino

; C++ standard - use C++17 (AVR-GCC supports it)
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -D ARDUINO_AVR_UNO
    -O2
    -Wall

; Serial monitor settings
monitor_speed = 9600

; Serial monitor filters
monitor_filters = 
    default
    time

